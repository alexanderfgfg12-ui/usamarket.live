name: USAMarket autonomous operations

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/autonomous-ops.yml"
      - "homepage.js"
      - "homepage-media.js"
      - "news-data.json"
      - "shop/products-manifest.json"
      - "cloudflare/usamarket-live-worker/**"

permissions:
  contents: read
  issues: write

concurrency:
  group: usamarket-autonomous-ops
  cancel-in-progress: false

jobs:
  health-check:
    name: Check live site and automated feeds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate site data and live endpoints
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import time
          import urllib.request
          import urllib.error
          import xml.etree.ElementTree as ET

          BASE = "https://usamarket.live"
          failures = []
          checks = []

          def get(path):
              url = BASE + path
              last_error = None
              for attempt in range(3):
                  try:
                      request = urllib.request.Request(
                          url,
                          headers={"User-Agent": "USAMarket-Autonomous-Ops/1.0", "Accept": "*/*"}
                      )
                      with urllib.request.urlopen(request, timeout=20) as response:
                          body = response.read()
                          if response.status < 200 or response.status >= 300:
                              raise RuntimeError(f"HTTP {response.status}")
                          return body, response.headers.get("Content-Type", "")
                  except Exception as exc:
                      last_error = exc
                      if attempt < 2:
                          time.sleep(4 * (attempt + 1))
              raise RuntimeError(f"{url}: {last_error}")

          def check(name, fn):
              try:
                  detail = fn()
                  checks.append((name, "PASS", str(detail)))
                  print(f"PASS | {name} | {detail}")
              except Exception as exc:
                  failures.append((name, str(exc)))
                  checks.append((name, "FAIL", str(exc)))
                  print(f"FAIL | {name} | {exc}")

          def json_endpoint(path):
              body, content_type = get(path)
              data = json.loads(body.decode("utf-8-sig"))
              return data

          def check_home():
              body, _ = get("/")
              if b"US Market Live" not in body:
                  raise RuntimeError("Homepage response did not contain the site identity")
              return f"{len(body)} bytes"

          def check_static_news():
              data = json_endpoint("/news-data.json")
              articles = data if isinstance(data, list) else data.get("articles", [])
              if not isinstance(articles, list) or not articles:
                  raise RuntimeError("news-data.json contains no articles")
              return f"{len(articles)} static articles"

          def check_product_manifest():
              data = json_endpoint("/shop/products-manifest.json")
              batches = data.get("batches", [])
              count = int(data.get("totalProducts", 0))
              if count < 1 or not batches:
                  raise RuntimeError("Product manifest is empty or has no batches")
              return f"{count} products; {len(batches)} batches"

          def check_sitemap_index():
              body, _ = get("/sitemap_index.xml")
              root = ET.fromstring(body)
              locations = [node.text.strip() for node in root.iter() if node.tag.endswith("loc") and node.text]
              required = {
                  BASE + "/sitemap.xml",
                  BASE + "/product-sitemap.xml",
                  BASE + "/news-sitemap-live.xml"
              }
              missing = sorted(required - set(locations))
              if missing:
                  raise RuntimeError("Missing sitemap entries: " + ", ".join(missing))
              return f"{len(locations)} sitemap entries"

          def check_worker_health():
              data = json_endpoint("/api/health")
              if data.get("status") != "worker-runtime-active":
                  raise RuntimeError("Worker health response is not active: " + repr(data))
              return data.get("service", "Worker active")

          def check_live_news():
              data = json_endpoint("/api/news?lang=en&healthcheck=1")
              articles = data.get("articles", [])
              if not isinstance(articles, list) or not articles:
                  raise RuntimeError("Live news API returned no articles")
              refresh = data.get("refreshStatus") or {}
              if refresh.get("ok") is not True:
                  raise RuntimeError("Latest RSS refresh failed or has no verified source response")
              checked_at = data.get("checkedAt") or refresh.get("checkedAt")
              if not checked_at:
                  raise RuntimeError("News refresh timestamp is missing")
              checked_ts = __import__("datetime").datetime.fromisoformat(checked_at.replace("Z", "+00:00")).timestamp()
              age_minutes = (time.time() - checked_ts) / 60
              if age_minutes > 360:
                  raise RuntimeError(f"News refresh is stale: last checked {age_minutes:.0f} minutes ago")
              feeds_ok = int(refresh.get("feedsOk", 0))
              feeds_total = int(refresh.get("feedsTotal", 0))
              if feeds_ok < 1 or feeds_total < 1:
                  raise RuntimeError("No RSS source returned a valid market-news feed")
              return f"{len(articles)} live articles; {feeds_ok}/{feeds_total} RSS feeds returned market stories; checked {age_minutes:.0f} minutes ago"

          def check_videos():
              data = json_endpoint("/api/videos?lang=en&category=all")
              videos = data.get("videos", [])
              if not isinstance(videos, list) or not videos:
                  raise RuntimeError("Video API returned no videos")
              return f"{len(videos)} videos"

          def check_live_news_sitemap():
              body, _ = get("/news-sitemap-live.xml")
              ET.fromstring(body)
              return f"{len(body)} bytes of valid XML"

          check("Homepage", check_home)
          check("Static news data", check_static_news)
          check("Affiliate product manifest", check_product_manifest)
          check("Sitemap index", check_sitemap_index)
          check("Cloudflare Worker health", check_worker_health)
          check("Live news feed", check_live_news)
          check("Video feed", check_videos)
          check("Dynamic news sitemap", check_live_news_sitemap)

          summary = ["## USAMarket autonomous operations", ""]
          for name, status, detail in checks:
              summary.append(f"- **{status}** — {name}: {detail}")
          summary.append("")
          summary.append(f"Result: **{'FAIL' if failures else 'PASS'}**")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as file:
              file.write("\n".join(summary) + "\n")

          if failures:
              raise SystemExit(1)
          PY

  report:
    name: Open or resolve an operations incident
    runs-on: ubuntu-latest
    needs: health-check
    if: always()
    steps:
      - name: Create, update, or resolve the health incident
        uses: actions/github-script@v7
        env:
          CHECK_RESULT: ${{ needs.health-check.result }}
        with:
          script: |
            const title = "[USAMarket Ops] Automated health checks failing";
            const result = process.env.CHECK_RESULT;
            const { owner, repo } = context.repo;
            const open = await github.rest.issues.listForRepo({
              owner, repo, state: "open", per_page: 100
            });
            const incident = open.data.find(issue => !issue.pull_request && issue.title === title);
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            if (result === "failure") {
              const body = [
                "Automated checks detected a problem in the live USAMarket site or one of its feeds.",
                "",
                `Workflow run: ${runUrl}`,
                `Commit: ${context.sha}`,
                "",
                "Open the workflow summary and logs for the exact failing checks. This issue is updated on subsequent failed runs and closed automatically after a fully successful check.",
                "",
                "This monitor does not modify production content, Cloudflare settings, affiliate feeds, or secrets."
              ].join("\n");
              if (incident) {
                await github.rest.issues.update({ owner, repo, issue_number: incident.number, body });
              } else {
                await github.rest.issues.create({
                  owner, repo, title, body
                });
              }
            } else if (result === "success" && incident) {
              await github.rest.issues.createComment({
                owner, repo, issue_number: incident.number,
                body: `All automated site checks passed. Resolving this incident.\n\nWorkflow run: ${runUrl}`
              });
              await github.rest.issues.update({
                owner, repo, issue_number: incident.number,
                state: "closed", state_reason: "completed"
              });
            } else if (result !== "success") {
              core.warning(`Health-check job ended with status: ${result}. No incident was auto-closed.`);
            }
