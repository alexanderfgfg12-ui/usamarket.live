name: Build APK via GitHub

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias ${{ secrets.KEY_ALIAS }} -keyalg RSA -keysize 2048 -validity 10000 -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} -dname "CN=US Market Live, OU=Dev, O=USMarket, L=NY, S=NY, C=US"

      - name: Initialize and Build App
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # إنشاء مجلد التطبيق وتوليد الإعدادات تلقائياً
          mkdir myapp && cd myapp
          bubblewrap init --manifest="https://usamarket.live/manifest.json" --directory=. --skipPwaValidation || true
          
          # تعديل ملف الإعدادات ليشير إلى مفتاح التوقيع الذي أنشأناه
          node -e "
            const fs = require('fs');
            let manifest = JSON.parse(fs.readFileSync('twa-manifest.json', 'utf8'));
            manifest.signingKey = { path: '../android.keystore', alias: '${{ secrets.KEY_ALIAS }}' };
            manifest.packageId = 'com.usamarket.live';
            fs.writeFileSync('twa-manifest.json', JSON.stringify(manifest, null, 2));
          "
          
          # بناء التطبيق
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: US-Market-APK
          path: myapp/app-release-signed.apk
