name: Build Signed Android App
on:
  workflow_dispatch:
  push:
    paths:
      - 'app.html'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.usamarket.live "US Market Live"
          cd myapp
          cordova platform add android

      - name: Copy Website to App
        run: |
          cp app.html myapp/www/index.html

      # إنشاء مفتاح التوقيع (Keystore) تلقائياً
      - name: Generate Keystore
        run: |
          cd myapp
          keytool -genkey -v -keystore release.keystore -alias usmarket -keyalg RSA -keysize 2048 -validity 10000 -storepass password123 -keypass password123 -dname "CN=US Market Live, OU=Development, O=US Market, L=New York, S=NY, C=US"

      # بناء التطبيق الموقّع
      - name: Build Signed APK
        run: |
          cd myapp
          cordova build android --release -- --keystore=release.keystore --storePassword=password123 --alias=usmarket --password=password123

      - name: Upload Signed APK
        uses: actions/upload-artifact@v4
        with:
          name: US-Market-Live-Release
          path: myapp/platforms/android/app/build/outputs/apk/release/app-release.apk
