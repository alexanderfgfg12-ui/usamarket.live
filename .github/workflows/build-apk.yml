name: Build and publish US Market Live Android app

on:
  push:
    branches:
      - fix/pwa-app-setup
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Android SDK and accept licenses
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is missing"; exit 1; }
          test -d "$ANDROID_HOME/cmdline-tools/latest/bin"
          if [ -L "$ANDROID_HOME/bin" ]; then rm "$ANDROID_HOME/bin"; fi
          if [ ! -e "$ANDROID_HOME/tools" ]; then
            ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          fi
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
          yes | "$ANDROID_HOME/tools/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/tools/bin/sdkmanager" --install "platforms;android-35" "build-tools;36.1.0" --sdk_root="$ANDROID_HOME"
          echo "Bubblewrap SDK paths and Android build tools configured."

      - name: Restore and verify release signing key
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing GitHub Secret KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub Secret KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing GitHub Secret KEY_PASSWORD}"
          : "${KEY_ALIAS:?Missing GitHub Secret KEY_ALIAS}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android.keystore
          test -s android.keystore
          keytool -list -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -keypasswd -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" -keypass "$KEY_PASSWORD" -new "$KEY_PASSWORD" >/dev/null
          mkdir -p android
          cp android.keystore android/android.keystore

      - name: Initialize Android Trusted Web Activity project
        shell: bash
        run: |
          set -euo pipefail
          yes "" | bubblewrap init --manifest=https://raw.githubusercontent.com/alexanderfgfg12-ui/usamarket.live/main/manifest.json --directory=android || test -s android/twa-manifest.json

      - name: Apply repository TWA configuration and build signed APK
        shell: bash
        run: |
          set -euo pipefail
          cd android
          jq --arg alias "$KEY_ALIAS" '.signingKey.path="./android.keystore" | .signingKey.alias=$alias' ../twa-manifest.json > twa-manifest.json
          bubblewrap update --skipVersionUpgrade
          bubblewrap build --signingKeyPath=./android.keystore --signingKeyAlias="$KEY_ALIAS"
          test -s app-release-signed.apk
          test -s app-release-bundle.aab

      - name: Generate Digital Asset Links
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(keytool -list -v -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/ {print $2; exit}')"
          test -n "$FINGERPRINT"
          mkdir -p .well-known
          cat > .well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.usamarket.live",
                "sha256_cert_fingerprints": ["$FINGERPRINT"]
              }
            }
          ]
          EOF

      - name: Upload APK, App Bundle, and Digital Asset Links artifact
        uses: actions/upload-artifact@v4
        with:
          name: usamarket-android-release
          path: |
            android/app-release-signed.apk
            android/app-release-bundle.aab
            .well-known/assetlinks.json
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 >/dev/null 2>&1; then
            gh release upload v1.0.0 android/app-release-signed.apk android/app-release-bundle.aab --clobber
          else
            gh release create v1.0.0 android/app-release-signed.apk android/app-release-bundle.aab --title "US Market Live v1.0.0" --notes "Signed Android APK and App Bundle for US Market Live."
          fi
