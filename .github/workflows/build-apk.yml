name: Build Android APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
      BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
      BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli

      - name: Configure Android tooling
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ANDROID_HOME:-}" || { echo "ANDROID_HOME is not available on this runner"; exit 1; }
          bubblewrap updateConfig --jdkPath="$JAVA_HOME" --androidSdkPath="$ANDROID_HOME"

      - name: Restore and verify signing key
        shell: bash
        run: |
          set -euo pipefail
          : "${KEYSTORE_BASE64:?Missing GitHub Secret KEYSTORE_BASE64}"
          : "${KEYSTORE_PASSWORD:?Missing GitHub Secret KEYSTORE_PASSWORD}"
          : "${KEY_PASSWORD:?Missing GitHub Secret KEY_PASSWORD}"
          : "${KEY_ALIAS:?Missing GitHub Secret KEY_ALIAS}"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android.keystore
          test -s android.keystore
          keytool -list -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          echo "Signing keystore and alias verified."

      - name: Generate Android project from TWA configuration
        run: bubblewrap update --skipVersionUpgrade --manifest=./twa-manifest.json

      - name: Build signed APK and App Bundle
        run: bubblewrap build --manifest=./twa-manifest.json --signingKeyPath=./android.keystore --signingKeyAlias="$KEY_ALIAS"

      - name: Generate Digital Asset Links file
        shell: bash
        run: |
          set -euo pipefail
          FINGERPRINT="$(keytool -list -v -keystore android.keystore -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" | awk -F': ' '/SHA256:/ {print $2; exit}')"
          test -n "$FINGERPRINT"
          mkdir -p .well-known
          cat > .well-known/assetlinks.json <<EOF
          [
            {
              "relation": ["delegate_permission/common.handle_all_urls"],
              "target": {
                "namespace": "android_app",
                "package_name": "com.usamarket.live",
                "sha256_cert_fingerprints": ["$FINGERPRINT"]
              }
            }
          ]
          EOF

      - name: Upload APK, App Bundle, and Digital Asset Links
        uses: actions/upload-artifact@v4
        with:
          name: usamarket-android-release
          path: |
            app-release-signed.apk
            app-release-bundle.aab
            .well-known/assetlinks.json
          if-no-files-found: error
          retention-days: 14
