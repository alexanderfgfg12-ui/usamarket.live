name: Build Simple APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install APK Builder
        run: npm install -g pwa-to-apk

      - name: Build APK
        run: |
          # استخدام أداة pwa-to-apk لبناء التطبيق مباشرة من الموقع
          pwa-to-apk build --url https://usamarket.live --name "US Market Live" --icon icon-512.png --output app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: US-Market-APK
          path: app-debug.apk
