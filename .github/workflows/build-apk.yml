name: Build APK via GitHub

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Bubblewrap
        run: npm install -g @bubblewrap/cli

      - name: Generate Keystore
        run: |
          keytool -genkey -v -keystore android.keystore -alias ${{ secrets.KEY_ALIAS }} -keyalg RSA -keysize 2048 -validity 10000 -storepass ${{ secrets.KEYSTORE_PASSWORD }} -keypass ${{ secrets.KEY_PASSWORD }} -dname "CN=US Market Live, OU=Dev, O=USMarket, L=NY, S=NY, C=US"

      - name: Initialize and Build App
        env:
          JAVA_HOME: ${{ env.JAVA_HOME }}
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          # إعداد Bubblewrap لاستخدام المسارات الصحيحة التي وفرها GitHub
          mkdir -p ~/.bubblewrap
          echo "{\"jdkPath\":\"$JAVA_HOME\",\"androidSdkPath\":\"$ANDROID_HOME\"}" > ~/.bubblewrap/config.json
          
          mkdir myapp && cd myapp
          
          cat <<EOF > twa-manifest.json
          {
            "packageId": "com.usamarket.live",
            "host": "usamarket.live",
            "name": "US Market Live",
            "launcherName": "US Market",
            "display": "standalone",
            "themeColor": "#0a0e17",
            "backgroundColor": "#0a0e17",
            "startUrl": "/index.html",
            "webManifestUrl": "https://usamarket.live/manifest.json",
            "iconUrl": "https://usamarket.live/icon-512.png",
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "enableNotifications": true,
            "shortcuts": [],
            "signingKey": {
              "path": "../android.keystore",
              "alias": "${{ secrets.KEY_ALIAS }}"
            }
          }
          EOF
          
          # بناء التطبيق
          bubblewrap build --skipPwaValidation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: US-Market-APK
          path: myapp/app-release-signed.apk
