name: Build Android App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Cordova
        run: npm install -g cordova

      - name: Create Cordova Project
        run: |
          cordova create myapp com.usamarket.live "US Market Live"
          cd myapp
          cordova platform add android

      - name: Copy Website to App
        run: |
          cp app.html myapp/www/index.html

      # الخطوة السحرية: نسخ الأيقونات إلى مجلد Cordova
      - name: Inject App Icons
        run: |
          # استبدال الأيقونات الافتراضية بأيقونات الموقع
          cp icon-192.png myapp/res/icon/android/ldpi.png
          cp icon-192.png myapp/res/icon/android/mdpi.png
          cp icon-192.png myapp/res/icon/android/hdpi.png
          cp icon-192.png myapp/res/icon/android/xhdpi.png
          cp icon-192.png myapp/res/icon/android/xxhdpi.png
          cp icon-512.png myapp/res/icon/android/xxxhdpi.png

      - name: Build APK
        run: |
          cd myapp
          cordova build android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: US-Market-Live-App
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
