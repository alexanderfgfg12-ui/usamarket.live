name: Sync affiliate products
on:
  push:
    branches: [main]
    paths:
      - 'scripts/sync-products.js'
      - 'scripts/generate-store-pages.js'
      - 'shop/shop.js'
      - 'feeds.json'
      - '.github/workflows/sync-products.yml'
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: write
concurrency:
  group: affiliate-product-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install feed parsers
        run: npm install --no-save --no-package-lock fast-xml-parser csv-parse
      - name: Import affiliate feeds from feeds.json in batches
        env:
          PRODUCT_BATCH_SIZE: 300
          ADMITAD_TEMPLATE_79310_URL: ${{ secrets.ADMITAD_TEMPLATE_79310_URL }}
          ADMITAD_TEMPLATE_79311_URL: ${{ secrets.ADMITAD_TEMPLATE_79311_URL }}
          ADMITAD_TEMPLATE_79312_URL: ${{ secrets.ADMITAD_TEMPLATE_79312_URL }}
          ADMITAD_TEMPLATE_79319_URL: ${{ secrets.ADMITAD_TEMPLATE_79319_URL }}
          ADMITAD_TEMPLATE_79320_URL: ${{ secrets.ADMITAD_TEMPLATE_79320_URL }}
          ADMITAD_TEMPLATE_79321_URL: ${{ secrets.ADMITAD_TEMPLATE_79321_URL }}
          ADMITAD_TEMPLATE_79322_URL: ${{ secrets.ADMITAD_TEMPLATE_79322_URL }}
          ADMITAD_TEMPLATE_79323_URL: ${{ secrets.ADMITAD_TEMPLATE_79323_URL }}
          ADMITAD_TEMPLATE_79324_URL: ${{ secrets.ADMITAD_TEMPLATE_79324_URL }}
          ADMITAD_TEMPLATE_79335_URL: ${{ secrets.ADMITAD_TEMPLATE_79335_URL }}
          ADMITAD_TEMPLATE_79336_URL: ${{ secrets.ADMITAD_TEMPLATE_79336_URL }}
          ADMITAD_TEMPLATE_79337_URL: ${{ secrets.ADMITAD_TEMPLATE_79337_URL }}
        run: node scripts/sync-products.js
      - name: Generate product detail pages, category pages and sitemap
        run: node scripts/generate-store-pages.js
      - name: Commit catalogue, pages and sitemap when changed
        run: |
          if git diff --quiet -- shop/ product-sitemap.xml; then
            echo "Catalogue unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A shop/ product-sitemap.xml
          git commit -m "chore: sync affiliate product batches"
          git push
