name: Build Articles from Batch

on:
  push:
    paths:
      - 'batch-*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Process Batches and Generate HTML
        run: node process-batch.js

      - name: Commit and Push Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json news/ sitemap.xml
          git diff --staged --quiet || git commit -m "📰 نشر أخبار وتحديث الخريطة"
          git push
