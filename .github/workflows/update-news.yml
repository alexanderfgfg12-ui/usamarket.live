name: Build Articles from Batch
on:
  push:
    paths:
      - 'batch-*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Process Batch
        run: node process-batch.js
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json news/
          git diff --staged --quiet || git commit -m "📝 نشر دفعة أخبار جديدة"
          git push
