name: Update News

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15 # زيادة المهلة الإجمالية للعملية
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        timeout-minutes: 2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
        timeout-minutes: 2

      - name: Install rss-parser
        run: npm install rss-parser --no-save --no-audit --no-fund --loglevel=error
        timeout-minutes: 3

      - name: Fetch and rewrite with AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node fetch-news.js
        timeout-minutes: 12 # زيادة المهلة لأن توليد المقالات يأخذ وقتاً
        continue-on-error: true

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news-data.json
          git add news/
          git diff --staged --quiet || git commit -m "🔄 Update news & articles $(date -u '+%Y-%m-%d %H:%M')"
          git push
        timeout-minutes: 3
        continue-on-error: true
