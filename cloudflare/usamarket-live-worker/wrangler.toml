name = "usamarket-live"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = true

routes = [
  { pattern = "usamarket.live/index.html", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/index.html", zone_name = "usamarket.live" },
  { pattern = "usamarket.live/api/videos", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/api/videos", zone_name = "usamarket.live" },
  { pattern = "usamarket.live/api/news", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/api/news", zone_name = "usamarket.live" },
  { pattern = "usamarket.live/api/cinema/catalog", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/api/cinema/catalog", zone_name = "usamarket.live" },
  { pattern = "usamarket.live/api/health", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/api/health", zone_name = "usamarket.live" },
  { pattern = "usamarket.live/api/admitad/products", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/api/admitad/products", zone_name = "usamarket.live" },
  { pattern = "usamarket.live/news-sitemap-live.xml", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/news-sitemap-live.xml", zone_name = "usamarket.live" },
  { pattern = "usamarket.live/news/live/*", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/news/live/*", zone_name = "usamarket.live" },
  { pattern = "usamarket.live/ar/news/live/*", zone_name = "usamarket.live" },
  { pattern = "www.usamarket.live/ar/news/live/*", zone_name = "usamarket.live" }
]

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/shop", "/shop/*", "/news/live/*", "/ar/news/live/*", "/news-sitemap-live.xml"]

# Preview configuration is required for branch-isolated Workers Builds.
[previews]

[[kv_namespaces]]
binding = "VIDEOS_KV"
id = "a189d0168a824bb4ab291c821b50767b"

[triggers]
crons = ["17 4 * * *", "0 */3 * * *"]
