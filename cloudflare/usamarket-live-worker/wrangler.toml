name = "usamarket-live"
main = "src/index.js"
compatibility_date = "2026-10-31"
workers_dev = true

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/news/live/*", "/ar/news/live/*", "/news-sitemap-live.xml"]

# Preview configuration is required for branch-isolated Workers Builds.
[previews]

[[kv_namespaces]]
binding = "VIDEOS_KV"
id = "a189d0168a824bb4ab291c821b50767b"

[triggers]
crons = ["17 4 * * *", "0 */3 * * *", "* * * * *"]
