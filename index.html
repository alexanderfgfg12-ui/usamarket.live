<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<meta name="mitgo-verification" content="6e0210b0-3520-48d5-9578-5766442d26d3">
<title>US Market Live - Real-Time US Market News</title>
<meta name="description" content="Real-time US stock market news, analysis, and insights.">
<link rel="canonical" href="https://usamarket.live/">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="/brand-icon.svg">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#ffffff">

<!-- Google Analytics 4 -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-S95EDYLHGF"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){window.dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-S95EDYLHGF');
</script>
</head>
<body>

<!-- شريط الأسعار -->
<div class="ticker-wrap" id="ticker">
  <div class="ticker">
    <span id="t-btc">₿ BTC: --</span>
    <span id="t-eth">Ξ ETH: --</span>
    <span id="t-spx">📈 S&P 500: 5,200</span>
  </div>
</div>

<header class="header">
  <div class="container header-inner">
    <a href="/shop/" class="shop-link" aria-label="Visit the US Market Live shop"><span class="shop-cart-icon" aria-hidden="true"><img src="/shop-cart-icon.svg" alt="" width="76" height="76"></span><span class="shop-link-label">SHOP</span></a>
    <a href="/" class="logo">
      <img src="/brand-logo.svg" alt="US Market Live" style="height: 48px; width: auto;">
    </a>
    
    <div class="search-container">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search news..." onkeyup="filterNews()">
    </div>
    
    <!-- أزرار الأقسام واللغة -->
    <div style="display: flex; align-items: center; gap: 15px; flex-wrap: wrap;">
      <nav class="category-nav">
        <a href="#" onclick="filterCategory('all', event)" class="cat-btn active">All</a>
        <a href="#" onclick="filterCategory('markets', event)" class="cat-btn">Markets</a>
        <a href="#" onclick="filterCategory('crypto', event)" class="cat-btn">Crypto</a>
        <a href="#" onclick="filterCategory('technology', event)" class="cat-btn">Tech</a>
        <a href="#" onclick="filterCategory('economy', event)" class="cat-btn">Economy</a>
      </nav>

      <!-- قائمة اختيار اللغة -->
      <select id="languageSelect" onchange="changeLanguage()" style="padding: 8px; border-radius: 20px; border: 1px solid #ccc; font-family: inherit; font-weight: bold; cursor: pointer; outline: none;">
        <option value="en">🇬🇧 English</option>
        <option value="ar">🇸🇦 العربية</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
        <option value="de">🇩🇪 Deutsch</option>
        <option value="zh-CN">🇨🇳 中文</option>
      </select>
    </div>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div class="live-badge" style="display:inline-block; background:#e8f5e9; color:#00C853; padding:5px 10px; border-radius:20px; font-weight:bold; font-size:0.8rem; margin-bottom:10px;">
      <span style="display:inline-block; width:8px; height:8px; background:#00C853; border-radius:50%; margin-right:5px; animation: pulse 1.5s infinite;"></span> LIVE UPDATES
    </div>
    <h1>Latest US Market News</h1>
    <div class="update-info"><span>🕒 Last updated: <strong id="lastUpdate">--</strong></span></div></section>

  <section id="latest" class="news-section">
    <div class="news-grid" id="newsGrid">
      <div class="loading">⏳ Loading latest news...</div>
    </div>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <p>© <span id="year"></span> US Market Live — All rights reserved</p>
    <p><a href="/privacy.html">Privacy Policy</a> | <a href="/about.html">About Us</a> | <a href="/contact.html">Contact</a></p>
  </div>
</footer>

<!-- حاوية مترجم جوجل المخفية -->
<div id="google_translate_element" style="display:none;"></div>

<script type="text/javascript">
function googleTranslateElementInit() {
  new google.translate.TranslateElement({
    pageLanguage: 'en',
    includedLanguages: 'en,ar,fr,es,de,zh-CN',
    autoDisplay: false
  }, 'google_translate_element');
}

// دالة تغيير اللغة عند اختيارها من القائمة
function changeLanguage() {
  var lang = document.getElementById('languageSelect').value;
  var selectField = document.querySelector("select.goog-te-combo");
  if (selectField) {
    selectField.value = lang;
    selectField.dispatchEvent(new Event('change'));
  } else {
    // إذا لم يتم تحميل المترجم بعد، ننتظر قليلاً ونحاول مرة أخرى
    setTimeout(function() {
      var selectField = document.querySelector("select.goog-te-combo");
      if (selectField) {
        selectField.value = lang;
        selectField.dispatchEvent(new Event('change'));
      }
    }, 1000);
  }
}
</script>
<script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<script src="script.js"></script>
<script>if ("serviceWorker" in navigator) { window.addEventListener("load", () => navigator.serviceWorker.register("/sw.js").catch(error => console.error("Service worker registration failed:", error))); }</script>
</body>
</html>
