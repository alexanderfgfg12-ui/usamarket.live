<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>US Market Live - Real-Time US Market News</title>
<meta name="description" content="Real-time US stock market news, analysis, and insights.">
<link rel="icon" type="image/png" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff">
</head>
<body>

<!-- شريط الأسعار الحية -->
<div class="ticker-wrap" id="ticker">
  <div class="ticker">
    <span id="t-btc">₿ BTC: --</span>
    <span id="t-eth">Ξ ETH: --</span>
    <span id="t-spx">📈 S&P 500: --</span>
  </div>
</div>

<header class="header">
  <div class="container header-inner" style="flex-wrap: wrap; gap: 10px;">
    <a href="/" class="logo">
      <img src="logo.png" alt="US Market Live" style="height: 45px;">
    </a>
    
    <!-- مربع البحث -->
    <input type="text" id="searchInput" placeholder="Search news..." onkeyup="filterNews()" style="padding: 10px; border-radius: 5px; border: 1px solid #ccc; width: 200px;">
    
    <nav class="nav">
      <a href="#latest" class="nav-link">Markets</a>
      <a href="#about" class="nav-link">About</a>
    </nav>
  </div>
</header>

<main class="container">
  <section class="hero">
    <h1>Latest US Market News</h1>
    <div class="update-info"><span>🕒 Last updated: <strong id="lastUpdate">--</strong></span></div>
    
    <div style="text-align: center; margin: 20px 0;">
      <a href="app-debug.apk" download class="download-btn">📱 Download Android App</a>
    </div>
  </section>

  <section id="latest" class="news-section">
    <div class="news-grid" id="newsGrid">
      <div class="loading">⏳ Loading...</div>
    </div>
  </section>

  <section id="about" class="about-section">
    <h2>About US Market Live</h2>
    <p>Real-time US stock market news, curated for investors.</p>
  </section>
</main>

<footer class="footer">
  <div class="container">
    <p>© <span id="year"></span> US Market Live</p>
    <p><a href="/privacy.html">Privacy</a> | <a href="/about.html">About</a></p>
  </div>
</footer>

<script src="script.js"></script>

<!-- Adsterra -->
<script data-cfasync="false" src="https://abscloud.org/1/98edaa5f9784b392c4d4edd549e1230d"></script>
<script src="https://araplhn.org/4/9da444c80a95bec4567e71a4e9ed57dc"></script>
</body>
</html>
