<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 520" role="img" aria-labelledby="t d">
<title id="t">USA Market News banner</title><desc id="d">A patriotic blue, white and red news banner with a New York skyline, Statue of Liberty silhouette, newspaper and USA Market News headline.</desc>
<defs>
 <linearGradient id="sky" x2="1" y2="1"><stop stop-color="#72baf2"/><stop offset=".48" stop-color="#f8fbff"/><stop offset="1" stop-color="#c5ddf8"/></linearGradient>
